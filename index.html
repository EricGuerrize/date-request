<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Datezinho?????</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 90%;
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            color: white;
            font-size: clamp(1.5rem, 5vw, 3rem);
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: heartbeat 2s infinite;
        }

        .buttons {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        button {
            padding: 20px 50px;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background-color: #4ade80;
            color: white;
            animation: pulse-shadow 2s infinite;
        }

        #yesBtn:hover {
            background-color: #22c55e;
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.4);
        }

        #noBtn {
            background-color: #f87171;
            color: white;
            position: fixed;
            z-index: 9999;
            max-width: calc(100dvw - 24px);
            padding: 14px 18px;
            font-size: clamp(0.95rem, 3.5vw, 1.4rem);
            line-height: 1.25;
            white-space: normal;
            word-break: break-word;
            transition: left 0.25s ease, top 0.25s ease;
        }

        .success {
            display: none;
            text-align: center;
            position: relative;
        }

        .success.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .hearts-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 2.5rem;
            animation: rotate 8s linear infinite;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .heart:nth-child(1) { animation-delay: 0s; }
        .heart:nth-child(2) { animation-delay: -1s; }
        .heart:nth-child(3) { animation-delay: -2s; }
        .heart:nth-child(4) { animation-delay: -3s; }
        .heart:nth-child(5) { animation-delay: -4s; }
        .heart:nth-child(6) { animation-delay: -5s; }
        .heart:nth-child(7) { animation-delay: -6s; }
        .heart:nth-child(8) { animation-delay: -7s; }

        .success-content {
            position: relative;
            z-index: 100;
            background: rgba(102, 126, 234, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 420px;
            margin: 0 auto;
        }

        .play-music-btn {
            display: none;
            margin-top: 20px;
            padding: 15px 30px;
            background: #4ade80;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .play-music-btn:hover {
            background: #22c55e;
        }

        .options-container {
            margin-top: 20px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .options-container h3 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .options-container h3 + h3,
        .options-container .section-title {
            margin-top: 18px;
        }

        .cinema-option {
            color: white;
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.12);
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.35);
        }

        .day-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .day-btn {
            flex: 1;
            min-width: 90px;
            padding: 12px 10px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: none;
        }

        .day-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .day-btn.selected {
            background: #4ade80;
            border-color: #22c55e;
            color: white;
        }

        .time-box {
            margin-top: 8px;
            color: white;
            background: rgba(255,255,255,0.12);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .time-box strong {
            font-size: 1.4rem;
        }

        .suggestion-box {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 44px;
        }

        .success h2 {
            color: white;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .confirm-time {
            color: rgba(255,255,255,0.95);
            font-size: clamp(0.95rem, 3vw, 1.15rem) !important;
            margin-bottom: 18px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .success p {
            color: white;
            font-size: clamp(1rem, 3vw, 1.5rem);
            line-height: 1.8;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #ytPlayer {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.05); }
            28% { transform: scale(1); }
            42% { transform: scale(1.05); }
            70% { transform: scale(1); }
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes rotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translateX(300px) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg) translateX(300px) rotate(-360deg);
            }
        }

        @media (max-width: 600px) {
            .buttons {
                height: 450px;
            }
            
            button {
                padding: 15px 35px;
            }

            .hearts-container {
                width: 250px;
                height: 250px;
            }

            .heart {
                font-size: 1.8rem;
            }

            .success-content {
                padding: 30px 20px;
            }

            @keyframes rotate {
                0% {
                    transform: translate(-50%, -50%) rotate(0deg) translateX(200px) rotate(0deg);
                }
                100% {
                    transform: translate(-50%, -50%) rotate(360deg) translateX(200px) rotate(-360deg);
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="question">
            <h1>Proposta de date, aceita??</h1>
            <div class="buttons">
                <button id="yesBtn">Sim</button>
                <button id="noBtn">Não</button>
            </div>
        </div>

        <div class="success" id="success">
            <div class="hearts-container">
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
            </div>
            <div class="success-content">
                <h2>Date aceito!!</h2>
                <p class="confirm-time" id="confirmTime"></p>
                
                <div class="options-container">
                    <h3>O date</h3>
                    <div class="cinema-option">🎬 Cinema — Homem-Aranha</div>
                    <label for="planSuggestion" style="display:block; color:white; margin-top:12px; font-size:0.95rem;">Quer sugerir outra coisa?</label>
                    <input type="text" id="planSuggestion" class="suggestion-box" placeholder="Ex: jantar, parque...">

                    <h3 class="section-title">Escolhe o dia:</h3>
                    <div class="day-options" id="dayOptions"></div>

                    <h3 class="section-title">Horário</h3>
                    <div class="time-box">⏰ <strong>21:00</strong></div>
                    <label for="timeSuggestion" style="display:block; color:white; margin-top:12px; font-size:0.95rem;">Sugestão de horário (se quiser outro):</label>
                    <input type="text" id="timeSuggestion" class="suggestion-box" placeholder="Ex: 20:30, 22h...">
                </div>

                <button id="whatsappBtn" style="margin-top: 20px; padding: 15px 30px; background: #25D366; color: white; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">📱 Confirmar no WhatsApp</button>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="play-music-btn" id="playMusicBtn" style="flex: 1; margin-top: 0; padding: 10px; font-size: 1rem;">🎵 Música</button>
                    <button id="backBtn" style="flex: 1; padding: 10px; background: #f87171; color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">Voltar</button>
                </div>
            </div>
        </div>

        <div id="ytPlayer"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const success = document.getElementById('success');
        const playMusicBtn = document.getElementById('playMusicBtn');
        const backBtn = document.getElementById('backBtn');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const dayOptions = document.getElementById('dayOptions');
        const timeSuggestion = document.getElementById('timeSuggestion');
        const planSuggestion = document.getElementById('planSuggestion');
        const confirmTime = document.getElementById('confirmTime');

        const THEME_VIDEO_ID = 'Xke6p-LJSlY';
        const THEME_START = 42;
        let ytPlayer = null;
        let ytApiReady = false;
        let pendingPlay = false;
        let selectedDay = null;

        const noTexts = [
            'Não',
            'Certeza absoluta?',
            'Aperta o verde, vai...',
            'Tá com dedo torto?',
            'Eu sou um partidão, pensa bem',
            'Nossa, que frieza...',
            'Vai me dar bolo mesmo?',
            'Cuidado, botão amaldiçoado',
            'Se clicar de novo a tela trava',
            'Tô chorando já 😭',
            'Não faz isso comigo!',
            'Só aceito o botão do lado',
            'Botão em manutenção 🛠️',
            'Eita como é difícil...'
        ];

        let noIndex = 0;

        function nextWeekday(targetDay) {
            const today = new Date();
            const result = new Date(today);
            result.setHours(0, 0, 0, 0);
            const current = today.getDay();
            let diff = targetDay - current;
            if (diff <= 0) diff += 7;
            result.setDate(today.getDate() + diff);
            return result;
        }

        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}`;
        }

        const days = [
            { name: 'Sexta', weekday: 5 },
            { name: 'Sábado', weekday: 6 },
            { name: 'Domingo', weekday: 0 }
        ].map((day) => {
            const date = nextWeekday(day.weekday);
            return {
                ...day,
                date,
                label: `${day.name}\n${formatDate(date)}`,
                value: `${day.name} ${formatDate(date)}`
            };
        });

        days.forEach((day) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'day-btn';
            btn.textContent = day.label.replace('\n', ' · ');
            btn.addEventListener('click', () => {
                selectedDay = day;
                document.querySelectorAll('.day-btn').forEach((el) => el.classList.remove('selected'));
                btn.classList.add('selected');
            });
            dayOptions.appendChild(btn);
        });

        function getVisibleArea() {
            const vv = window.visualViewport;
            if (vv) {
                return {
                    left: vv.offsetLeft,
                    top: vv.offsetTop,
                    width: vv.width,
                    height: vv.height
                };
            }
            return {
                left: 0,
                top: 0,
                width: window.innerWidth,
                height: window.innerHeight
            };
        }

        function keepNoButtonOnScreen(x, y) {
            const margin = 12;
            const view = getVisibleArea();
            const btnW = noBtn.offsetWidth;
            const btnH = noBtn.offsetHeight;
            const minX = view.left + margin;
            const minY = view.top + margin;
            const maxX = view.left + view.width - btnW - margin;
            const maxY = view.top + view.height - btnH - margin;

            const clampedX = maxX < minX ? minX : Math.min(Math.max(x, minX), maxX);
            const clampedY = maxY < minY ? minY : Math.min(Math.max(y, minY), maxY);

            noBtn.style.left = clampedX + 'px';
            noBtn.style.top = clampedY + 'px';
        }

        function moveButton() {
            noIndex = (noIndex + 1) % noTexts.length;
            noBtn.textContent = noTexts[noIndex];

            const view = getVisibleArea();
            const margin = 12;
            const maxX = Math.max(margin, view.width - noBtn.offsetWidth - margin);
            const maxY = Math.max(margin, view.height - noBtn.offsetHeight - margin);

            const randomX = view.left + margin + Math.random() * Math.max(0, maxX - margin);
            const randomY = view.top + margin + Math.random() * Math.max(0, maxY - margin);

            keepNoButtonOnScreen(randomX, randomY);
        }

        let lastMove = 0;
        function handleNoMove(e) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastMove < 280) return;
            lastMove = now;
            moveButton();
        }

        noBtn.addEventListener('mouseover', handleNoMove);
        noBtn.addEventListener('touchstart', handleNoMove, { passive: false });
        noBtn.addEventListener('click', handleNoMove);

        window.addEventListener('resize', () => {
            if (noBtn.style.left) {
                keepNoButtonOnScreen(parseFloat(noBtn.style.left), parseFloat(noBtn.style.top));
            }
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                if (noBtn.style.left) {
                    keepNoButtonOnScreen(parseFloat(noBtn.style.left), parseFloat(noBtn.style.top));
                }
            });
        }

        window.onYouTubeIframeAPIReady = function () {
            ytApiReady = true;
            ytPlayer = new YT.Player('ytPlayer', {
                height: '1',
                width: '1',
                videoId: THEME_VIDEO_ID,
                playerVars: {
                    autoplay: 0,
                    start: THEME_START,
                    controls: 0
                },
                events: {
                    onReady: () => {
                        if (pendingPlay) playMusic();
                    },
                    onStateChange: (event) => {
                        if (event.data === YT.PlayerState.ENDED) {
                            ytPlayer.seekTo(THEME_START, true);
                            ytPlayer.playVideo();
                        }
                    }
                }
            });
        };

        function playMusic() {
            pendingPlay = true;
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
                playMusicBtn.style.display = 'inline-block';
                return;
            }

            if (typeof ytPlayer.seekTo === 'function') {
                ytPlayer.seekTo(THEME_START, true);
            }
            const result = ytPlayer.playVideo();
            Promise.resolve(result)
                .then(() => {
                    playMusicBtn.style.display = 'none';
                })
                .catch(() => {
                    playMusicBtn.style.display = 'inline-block';
                });

            setTimeout(() => {
                const state = ytPlayer.getPlayerState && ytPlayer.getPlayerState();
                if (state !== 1) {
                    playMusicBtn.style.display = 'inline-block';
                } else {
                    playMusicBtn.style.display = 'none';
                }
            }, 800);
        }

        function stopMusic() {
            pendingPlay = false;
            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                ytPlayer.stopVideo();
            }
        }

        function formatConfirmTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `Confirmado às ${hours}:${minutes} · ${day}/${month}`;
        }

        yesBtn.addEventListener('click', () => {
            question.style.display = 'none';
            success.classList.add('show');
            confirmTime.textContent = formatConfirmTime(new Date());
            playMusic();
        });

        playMusicBtn.addEventListener('click', playMusic);

        backBtn.addEventListener('click', () => {
            success.classList.remove('show');
            question.style.display = 'block';
            stopMusic();
            noBtn.removeAttribute('style');
            noBtn.textContent = 'Não';
            noIndex = 0;
        });

        whatsappBtn.addEventListener('click', () => {
            let message = "Oii! Aceito o datezinho! 🥰";
            message += "\nQuero: Cinema — Homem-Aranha";

            const otherPlan = planSuggestion.value.trim();
            if (otherPlan) {
                message += `\nSugestão de date: ${otherPlan}`;
            }

            if (selectedDay) {
                message += `\nNo dia: ${selectedDay.value}`;
            }

            message += "\nHorário: 21:00";

            const suggestion = timeSuggestion.value.trim();
            if (suggestion) {
                message += `\nSugestão de horário: ${suggestion}`;
            }

            if (confirmTime.textContent) {
                message += `\n${confirmTime.textContent}`;
            }

            const whatsappUrl = `https://wa.me/5565992556938?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        });

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
    </script>
</body>
</html>

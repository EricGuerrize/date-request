<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datezinho?????</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 90%;
        }

        h1 {
            color: white;
            font-size: clamp(1.5rem, 5vw, 3rem);
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .buttons {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        button {
            padding: 20px 50px;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background-color: #4ade80;
            color: white;
        }

        #yesBtn:hover {
            background-color: #22c55e;
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.4);
        }

        #noBtn {
            background-color: #f87171;
            color: white;
            position: fixed; /* livre pela tela */
            transition: all 0.3s ease;
        }

        .success {
            display: none;
            text-align: center;
            position: relative;
        }

        .success.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .hearts-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 2.5rem;
            animation: rotate 8s linear infinite;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .heart:nth-child(1) { animation-delay: 0s; }
        .heart:nth-child(2) { animation-delay: -1s; }
        .heart:nth-child(3) { animation-delay: -2s; }
        .heart:nth-child(4) { animation-delay: -3s; }
        .heart:nth-child(5) { animation-delay: -4s; }
        .heart:nth-child(6) { animation-delay: -5s; }
        .heart:nth-child(7) { animation-delay: -6s; }
        .heart:nth-child(8) { animation-delay: -7s; }

        .success-content {
            position: relative;
            z-index: 100;
            background: rgba(102, 126, 234, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .play-music-btn {
            display: none;
            margin-top: 20px;
            padding: 15px 30px;
            background: #4ade80;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .play-music-btn:hover {
            background: #22c55e;
        }

        .success h2 {
            color: white;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .success p {
            color: white;
            font-size: clamp(1rem, 3vw, 1.5rem);
            line-height: 1.8;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Aumentando o diâmetro da órbita dos corações */
        @keyframes rotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translateX(300px) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg) translateX(300px) rotate(-360deg);
            }
        }

        @media (max-width: 600px) {
            .buttons {
                height: 450px;
            }
            
            button {
                padding: 15px 35px;
            }

            .hearts-container {
                width: 250px;
                height: 250px;
            }

            .heart {
                font-size: 1.8rem;
            }

            .success-content {
                padding: 30px 20px;
            }

            @keyframes rotate {
                0% {
                    transform: translate(-50%, -50%) rotate(0deg) translateX(200px) rotate(0deg);
                }
                100% {
                    transform: translate(-50%, -50%) rotate(360deg) translateX(200px) rotate(-360deg);
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="question">
            <h1>Datezinho?</h1>
            <div class="buttons">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div class="success" id="success">
            <div class="hearts-container">
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
                <div class="heart">❤️</div>
            </div>
            <div class="success-content">
                <h2>GRAÇAS A DEUS!!! OBRIGADO! 🎉</h2>
                <p><strong>📍Quando voce chegar em Cuiabá!!!📍</strong></p>
                <p style="margin-top: 20px;">Para mais informações, entre em contato com o numero abaixo:</p>
                <p><strong>65 99255-6938</strong></p>
                <button class="play-music-btn" id="playMusicBtn">🎵 Tocar Música</button>
            </div>
        </div>
        
        <audio id="backgroundMusic" preload="auto">
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const success = document.getElementById('success');
        const playMusicBtn = document.getElementById('playMusicBtn');
        const audio = document.getElementById('backgroundMusic');

        const noTexts = [
            'Não',
            'Tem certeza?',
            'Não me estressa',
            'Pensa melhor',
            'Desiste',
            'Sério mesmo?',
            'Última chance',
            'Para com isso',
            'Clica no SIM',
            'Vai...'
        ];

        let noIndex = 0;

        function moveButton() {
            // limites da tela
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;

            // posição aleatória
            let randomX = Math.random() * maxX;
            let randomY = Math.random() * maxY;

            // deslocamento extra para "fugir mais longe"
            randomX += (Math.random() - 0.5) * 300; 
            randomY += (Math.random() - 0.5) * 300;

            // manter dentro da tela
            randomX = Math.max(0, Math.min(randomX, maxX));
            randomY = Math.max(0, Math.min(randomY, maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            noIndex = (noIndex + 1) % noTexts.length;
            noBtn.textContent = noTexts[noIndex];
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        function playMusic() {
            audio.play()
                .then(() => {
                    playMusicBtn.style.display = 'none';
                })
                .catch((error) => {
                    console.log('Autoplay bloqueado:', error);
                    playMusicBtn.style.display = 'inline-block';
                });
        }

        yesBtn.addEventListener('click', () => {
            question.style.display = 'none';
            success.classList.add('show');
            playMusic();
        });

        playMusicBtn.addEventListener('click', playMusic);
    </script>
</body>
</html>
